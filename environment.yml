name: cooling
channels:
  - conda-forge
dependencies:
  - python=3.11
  - pip
  - numpy
  - scipy
  - matplotlib=3.10.9
  - pandas
  - seaborn
  - ipython
  # VS Code Jupyter 2025.9.1 can hang during startup with ipykernel 7.
  - ipykernel<7
  - pytest=9.0.3
  - pip:
      - pennylane==0.44.1
      - juliacall
